name: Import RouteMaps CI branch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/import-routemaps.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild RouteMaps CI branch from preserved Git bundle
        shell: bash
        run: |
          set -euo pipefail

          base64 -d .bootstrap/routemaps.bundle.b64 > /tmp/routemaps.bundle
          git bundle verify /tmp/routemaps.bundle

          git fetch /tmp/routemaps.bundle             refs/heads/ci/routemaps-release-v2:refs/remotes/bundle/ci-routemaps-release-v2

          git config user.name "RouteMaps CI Bootstrap"
          git config user.email "actions@users.noreply.github.com"

          git checkout -B ci/routemaps-release-v2 main

          git cherry-pick 62332c95633f3900194811d36a5eae18ea28e004
          git cherry-pick cce938218b64cc1cf53c971aecf5eb1faabadc6d
          git cherry-pick ad3aea8b7503b2fecf3f0203c64c5fa859feb341

          git rm -f README.md
          git rm -f .bootstrap/routemaps.bundle.b64
          git rm -f .github/workflows/import-routemaps.yml
          git commit -m "chore: remove CI bootstrap transport"

          git push origin ci/routemaps-release-v2
